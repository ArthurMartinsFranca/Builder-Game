<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Builder Game</title>
    <link rel="shortcut icon" href="sprites/Coolplayer.png" type="img">
    <script src="js/game.js" type="module" defer></script>
    <link rel="stylesheet" href="game.css">
</head>
<body>
    <div id="container">
        <canvas id="canvas"></canvas>
    </div>
    <header>
        <a href="index.html">
            <button id="sair">🚪</button>
        </a>
    </header>
    
    <div id="inventario">
        <button class="slot" id="parede1">
             <div data-type="number3 text">VALOR: 10 MADEIRAS</div>
             <div data-type="number3">0</div>
        </button>
        <button class="slot" id="parede2">
                <div data-type="number4 text">VALOR: 15 PEDRAS</div>
             <div data-type="number4">0</div>
        </button>
        <button class="slot" id="parede3">
            <div data-type="number5 text"></div>
             <div data-type="number5">0</div>
        </button>
        <button class="slot" id="parede4">
            <div data-type="number6 text"></div>
             <div data-type="number6">0</div>
        </button>
        <button class="slot" id="parede5">
            <div data-type="number7 text"></div>
             <div data-type="number7">0</div>
        </button>
        <button class="slot" id="remover">X</button>
    </div>
    <div id="inventario-de-recursos">
        <div class="slot-de-recurso">
            <div data-type="number1">0</div>
        </div>
        <div class="slot-de-recurso">
            <div data-type="number2">0</div>
        </div>
    </div>
                                                                           
</body>
</html>
