<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Builder Game</title>
    <link rel="shortcut icon" href="sprites/Coolplayer.png" type="img">
    <script src="js/game.js" type="module" defer></script>
    <link rel="stylesheet" href="game.css">
</head>
<body>
    <div id="container">
        <canvas id="canvas"></canvas>
    </div>
    <header>
        <a href="index.html">
            <button id="sair">🚪</button>
        </a>
    </header>
    
    <div id="inventario">
        <div class="slot" id="parede1">
             <div data-type="number3 text" class="preco">VALOR: 5 MADEIRAS</div>
             <div data-type="number3" class="qtd">0</div>
             <button class="comprar-bloco">COMPRAR</button>
        </div>
        
        <div class="slot" id="parede2">
             <div data-type="number4 text" class="preco">VALOR: 10 PEDRAS</div>
             <div data-type="number4"  class="qtd" >0</div>
             <button class="comprar-bloco">COMPRAR</button>
        </div>
        <div class="slot" id="parede3">
             <div data-type="number5 text" class="preco">VALOR: 15 PEDRAS</div>
             <div data-type="number5" class="qtd">0</div>
             <button class="comprar-bloco">COMPRAR</button>
        </div>
        <div class="slot" id="parede4">
             <div data-type="number6 text" class="preco">VALOR: 5 PEDRAS</div>
             <div data-type="number6" class="qtd">0</div>
             <button class="comprar-bloco">COMPRAR</button>
        </div>
        <div class="slot" id="parede5">
             <div data-type="number7 text" class="preco">VALOR: 15 PEDRAS</div>
             <div data-type="number7" class="qtd">0</div>
             <button class="comprar-bloco">COMPRAR</button>
        </div>
        <button class="slot" id="remover">X</button>
    </div>
    <div id="inventario-de-recursos">
        <div class="slot-de-recurso">
            <div data-type="number1">0</div>
        </div>
        <div class="slot-de-recurso">
            <div data-type="number2">0</div>
        </div>
    </div>

    <button id="moveis">MOVEIS</button>

    <div id="painel-moveis">
        <div>
            <div class="precoMoveis">PRECO 50 MADEIRAS</div>
            <img src="sprites/cama.png" alt="">
            <div data-type="number8">0</div>
            <button class="comprar-movel">COMPRAR</button>
        </div>
        <div>
            <div class="precoMoveis">PRECO 30 PEDRAS</div>
            <img src="sprites/banheira.png" alt="">
            <div data-type="number9">0</div>
            <button class="comprar-movel">COMPRAR</button>
        </div>
        <div>
            <div class="precoMoveis">PRECO 25 MADEIRAS</div>
            <img src="sprites/mesa.png" alt="">
            <div data-type="number10" >0</div>
            <button class="comprar-movel">COMPRAR</button>
        </div>
        <div>
            <div class="precoMoveis">PRECO 30 MADEIRAS</div>
            <img src="sprites/mesadejantar.png" alt="">
            <div data-type="number11" >0</div>
            <button class="comprar-movel">COMPRAR</button>
        </div>
        <div>
            <div class="precoMoveis">PRECO 20 PEDRAS</div>
            <img src="sprites/pia.png" alt="">
            <div data-type="number12" >0</div>
            <button class="comprar-movel">COMPRAR</button>
        </div>
        <div>
            <div class="precoMoveis">PRECO 15 PEDRAS</div>
            <img src="sprites/privada.png" alt="">
            <div data-type="number13" >0</div>
            <button class="comprar-movel">COMPRAR</button>
        </div>
        <div>
            <div class="precoMoveis">PRECO 40 MADEIRAS</div>
            <img src="sprites/sofa.png" alt="">
            <div data-type="number14" >0</div>
            <button class="comprar-movel">COMPRAR</button>
        </div>
    </div>
                                                                           
</body>
</html>
